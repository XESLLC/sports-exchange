type Tournament {
  id: ID!
  name: String!
  leagueId: ID!
  isIpoOpen: Boolean!
  settings: LeagueSettings
  createdAt: String!
  isActive: Boolean!
  masterSheetUpload: String
  pricingSheetUpload: String
  rulesSheetUpload: String
  projectedPayoutSheetUpload: String
  stockPayoutSheetUpload: String
}

type TournamentWithLeagueName {
  id: ID!
  name: String!
  leagueId: ID!
  leagueName: String
  createdAt: String!
  isActive: Boolean!
  masterSheetUpload: String
  pricingSheetUpload: String
  rulesSheetUpload: String
  projectedPayoutSheetUpload: String
  stockPayoutSheetUpload: String
}

type TournamentTeam {
  id: ID!
  tournamentId: ID!
  teamId: ID!
  price: Float!
  seed: Int
  region: String
}

type RegularSeasonDividendPreviewTeam {
  tournamentTeamId: ID!
  teamId: ID!
  teamName: String
  matched: Boolean!
  wins: Int!
  losses: Int!
  ties: Int!
  dividendPrice: Float!
}

type RegularSeasonDividendPreview {
  totalPoolInvested: Float!
  totalLeagueWins: Int!
  perWinRate: Float!
  unmatchedTeamNames: [String]!
  teams: [RegularSeasonDividendPreviewTeam]!
}

type MilestoneAchievementPreviewTeam {
  tournamentTeamId: ID!
  teamId: ID!
  teamName: String
  matched: Boolean!
  achieved: Boolean!
  dividendPrice: Float!
}

type MilestoneAchievementPreview {
  totalPoolInvested: Float!
  poolPercent: Float!
  flatBonus: Float!
  unmatchedTeamNames: [String]!
  teams: [MilestoneAchievementPreviewTeam]!
}

input TournamentInput {
  name: String!
  leagueId: String!
}

input UpdateTournamentInput {
  id: ID!
  name: String!
  leagueId: String!
}

input DeleteTournamentInput {
  id: ID!
}

input TournamentTeamInput {
  price: Float!
  teamId: ID!
  seed: Int!
  region: String
  tournamentId: ID!
}

input BulkTournamentTeamInput {
  teamId: ID!
  tournamentId: ID!
}

input TournamentTeamMilestoneInput {
  id: ID!
  milestoneInput: MilestoneDataInput
}

input MilestoneDataInput {
  milestoneId: String!
  milestoneName: String!
  dividendPrice: Float!
  wins: Int
  losses: Int
  ties: Int
}

type Query {
  getTournamentsByLeagueId(leagueId: ID!): [Tournament]
  getTournamentTransactions(tournamentId: ID!): [Transaction]
  tournaments: [TournamentWithLeagueName]
  tournament(id: ID!): Tournament
  previewRegularSeasonDividends(tournamentId: ID!): RegularSeasonDividendPreview
  previewDivisionTitleDividends(tournamentId: ID!): MilestoneAchievementPreview
  previewConfSeed1Dividends(tournamentId: ID!): MilestoneAchievementPreview
}

type Mutation {
  createOrUpdateMilestoneData(input: TournamentTeamMilestoneInput!): Team
  updateMilestonePoolPercent(tournamentId: ID!, milestoneId: String!, poolPercent: Float!): Tournament
  createTournament(input: TournamentInput!): Tournament!
  createTournamentTeam(input: TournamentTeamInput!): TournamentTeam!
  createBulkTournamentTeams(input: [BulkTournamentTeamInput]!): [TournamentTeam]!
  updateTournament(input: UpdateTournamentInput!): ID!
  deleteTournament(input: DeleteTournamentInput!): ID
  toggleIsIpoOpen(tournamentId: ID!, isIpoOpen: Boolean!): Tournament
  toggleIsTournamentActive(tournamentId: ID!, isActive: Boolean!): Tournament
  updateTournamentTeam(input: TournamentTeamInput!): TournamentTeam
  toggleTournamentTeamEliminated(tournamentTeamId: ID!, isEliminated: Boolean!): TournamentTeam
  # uploadFile(tournamentId: ID!, sheetType: String!, file: Upload!): Tournament
}
